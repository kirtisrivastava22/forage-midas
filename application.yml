general:
  kafka-topic: my-test-topic
server:
  port: 33400
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}  # tests usually override / embedded broker wires itself
    consumer:
      group-id: midas-core-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # optionally:
        # spring.json.value.default.type: com.jpmc.midascore.foundation.Transaction
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    datasource:
      url: jdbc:h2:mem:midasdb
      driver-class-name: org.h2.Driver
      username: sa
      password: ""
    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: create-drop
      show-sql: true
    h2:
      console:
        enabled: true

